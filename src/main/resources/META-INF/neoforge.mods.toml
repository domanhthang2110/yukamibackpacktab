modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The required versions
[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="required"
    versionRange="[${sophisticated_backpacks_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedcore"
    type="required"
    versionRange="[${sophisticated_core_version},)"
    ordering="AFTER"
    side="BOTH"

# Above the required version -> Maybe ok, maybe not, so "discouraged".
[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="discouraged"
    versionRange="(${sophisticated_backpacks_version},)"
    reason="This version is newer than the version tested with the current release. Compatibility has not been verified, and unexpected behavior is to be expected."
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedcore"
    type="discouraged"
    versionRange="(${sophisticated_core_version},)"
    reason="This version is newer than the version tested with the current release. Compatibility has not been verified, and unexpected behavior is to be expected."
    ordering="AFTER"
    side="BOTH"
